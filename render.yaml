# Blueprint de Render (opcional): New → Blueprint → elegir este repo.
# Si preferís crear los servicios a mano desde el dashboard, usá los mismos valores.
# Ajustá los nombres/URLs si "voltmap" ya está tomado en Render.
services:
  # ─── Backend: Web Service ───
  - type: web
    name: voltmap-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://voltmap.onrender.com
      - key: FRONTEND_URL
        value: https://voltmap.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ─── Frontend: Static Site ───
  - type: web
    name: voltmap
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # 1) La API se llama por /api: Render la proxea al backend (mismo origen → cookies OK)
      - type: rewrite
        source: /api/*
        destination: https://voltmap-api.onrender.com/api/*
      # 2) SPA: F5 en cualquier ruta devuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
